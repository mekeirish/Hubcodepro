    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deep: {
                            900: '#0b0b0d',
                            800: '#0f0f11',
                            700: '#141418',
                            600: '#16161a',
                            500: '#1a1a1f',
                        },
                        cyber: {
                            violet: '#8b5cf6',
                            'violet-hover': '#7c3aed',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neu-dark': 'inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 12px rgba(0,0,0,0.6)',
                        'neu-pressed': 'inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.03)',
                        'glow-violet': '0 0 12px rgba(139,92,246,0.3), 0 0 24px rgba(139,92,246,0.1)',
                        'glow-amber': '0 0 8px rgba(245,158,11,0.3), 0 0 16px rgba(245,158,11,0.1)',
                    },
                    animation: {
                        'pulse-amber': 'pulse-amber 0.8s infinite alternate',
                        'flash-red': 'flash-red 0.4s infinite',
                        'spin-slow': 'spin 0.7s linear infinite',
                    },
                    keyframes: {
                        'pulse-amber': {
                            'from': { opacity: '0.4', transform: 'scale(0.9)' },
                            'to': { opacity: '1', transform: 'scale(1.1)' },
                        },
                        'flash-red': {
                            '0%, 100%': { backgroundColor: 'transparent', boxShadow: 'none', color: 'inherit' },
                            '50%': { backgroundColor: '#ef4444', boxShadow: '0 0 12px #ef4444', color: 'white' },
                        },
                        'spin': {
                            'to': { transform: 'rotate(360deg)' },
                        },
                    }
                }
            }
        }
    </script>

    <script>
        // =============================================
        // HUBCODE — 100% COMPATIBLE MASTERCODE
        // =============================================
        
        let allRepositories = [];
        let audioCtx = null;
        let upModeState = {};
        let customModalContext = null;
        let imageModalContext = null;
        let posterObserver = null;

        const REPO_CACHE_KEY = 'hubcode_repos_cache';
        const REPO_CACHE_TTL = 5 * 60 * 1000;

        function getCachedRepos() {
            try {
                const raw = localStorage.getItem(REPO_CACHE_KEY);
                if (!raw) return null;
                const cached = JSON.parse(raw);
                if (Date.now() - cached.timestamp > REPO_CACHE_TTL) {
                    localStorage.removeItem(REPO_CACHE_KEY);
                    return null;
                }
                return cached.data;
            } catch { return null; }
        }

        function setCachedRepos(repos) {
            try {
                localStorage.setItem(REPO_CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    data: repos
                }));
            } catch {}
        }

        const POSTER_CACHE_KEY = 'hubcode_poster_cache';
        function getPosterCache() {
            try {
                const raw = localStorage.getItem(POSTER_CACHE_KEY);
                if (!raw) return {};
                return JSON.parse(raw);
            } catch { return {}; }
        }
        function setPosterCache(cache) {
            try { localStorage.setItem(POSTER_CACHE_KEY, JSON.stringify(cache)); } catch {}
        }
        function updatePosterCache(repoKey, dataUrl) {
            const cache = getPosterCache();
            cache[repoKey] = dataUrl;
            setPosterCache(cache);
            posterMemoryCache.set(repoKey, dataUrl);
        }

        const posterMemoryCache = new Map();

        function b64ToUtf8(b64) {
            try {
                const binary = atob(b64.replace(/\s/g, ''));
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder('utf-8').decode(bytes);
            } catch(e) {
                return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
            }
        }
        function utf8ToB64(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            } catch(e) {
                return btoa(unescape(encodeURIComponent(str)));
            }
        }
        function normalize(s) { return s.replace(/\r\n/g, '\n').trim(); }

        function playHum60Hz() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 60;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        // =============================================
        // REDIMENSIONNEMENT ICÔNE — IDENTIQUE MASTERCODE
        // =============================================
        function resizeImageToIcon(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const size = 512;
                        const canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        
                        // Recadrage centré (cover) — EXACTEMENT comme Mastercode
                        let sourceX = 0, sourceY = 0, sourceWidth = img.width, sourceHeight = img.height;
                        if (img.width > img.height) {
                            sourceWidth = img.height;
                            sourceX = (img.width - img.height) / 2;
                        } else if (img.height > img.width) {
                            sourceHeight = img.width;
                            sourceY = (img.height - img.width) / 2;
                        }
                        
                        ctx.drawImage(img, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, size, size);
                        
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error("Échec création blob PNG"));
                            const blobReader = new FileReader();
                            blobReader.onload = () => {
                                const dataUrl = blobReader.result;
                                if (dataUrl && dataUrl.startsWith('data:image/png;base64,')) {
                                    resolve(dataUrl);
                                } else {
                                    reject(new Error("Format de données invalide"));
                                }
                            };
                            blobReader.onerror = () => reject(new Error("Erreur lecture blob"));
                            blobReader.readAsDataURL(blob);
                        }, 'image/png');
                    };
                    img.onerror = () => reject(new Error("Échec chargement image"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Échec lecture fichier"));
                reader.readAsDataURL(file);
            });
        }

        // Vérification dimensions
        function checkImageDimensions(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({ width: img.width, height: img.height });
                img.onerror = () => reject(new Error("Impossible de lire l'image"));
                img.src = dataUrl;
            });
        }

        // Régénérer le SW avec cache versionné (identiquement à Mastercode)
        async function regenerateServiceWorker(owner, repo, branch) {
            const token = localStorage.getItem('hubcode_token');
            if (!token) throw new Error("Token manquant");
            
            const swContent = `const CACHE_NAME = '${repo}-' + Date.now();\n` +
                `self.addEventListener('install', e => {\n` +
                `  e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./index.html','./manifest.json','./icon.png'])));\n` +
                `});\n` +
                `self.addEventListener('activate', e => {\n` +
                `  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))));\n` +
                `});\n` +
                `self.addEventListener('fetch', e => {\n` +
                `  e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));\n` +
                `});`;
            
            let swSha = null;
            const swGet = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/sw.js?ref=${branch}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (swGet.ok) swSha = (await swGet.json()).sha;
            
            const swB64 = utf8ToB64(swContent);
            const putBody = {
                message: "Hubcode: update SW (cache bust)",
                content: swB64,
                branch: branch
            };
            if (swSha) putBody.sha = swSha;
            
            const putResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/sw.js`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(putBody)
            });
            
            if (!putResp.ok) throw new Error("Échec régénération SW");
            addLog(repo, "✅ SW régénéré (cache bust)", 'success');
        }

                    throw new Error("Aucune donnée image fournie");

                addLog(logRepo, `Vérification ${filename}...`, 'loading');
                let currentSha = null;
                const getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filename}?ref=${branch}`;
                const getResp = await fetch(getUrl, { headers: { 'Authorization': `token ${token}` } });
                if (getResp.status === 200) {

                    branch: branch

                if (currentSha) putBody.sha = currentSha;
                const putResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },

                    imageBtn.disabled = false;
                    imageBtn.classList.remove('opacity-50', 'pointer-events-none');
                }
                setActivityState(false);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const base64 = dataUrl.split(',')[1];
                    if (!base64) reject(new Error("Format de données invalide"));
                    else resolve(base64);
                };
                reader.onerror = () => reject(new Error("Erreur de lecture"));
                reader.readAsDataURL(file);
            });
        }

        function resizeImageToPosterContain(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const targetWidth = 540, targetHeight = 960;
                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, targetWidth, targetHeight);
                        const imgRatio = img.width / img.height;
                        const targetRatio = targetWidth / targetHeight;
                        let drawWidth, drawHeight, offsetX, offsetY;
                        if (imgRatio > targetRatio) {
                            drawWidth = targetWidth;
                            drawHeight = targetWidth / imgRatio;
                            offsetX = 0;
                            offsetY = (targetHeight - drawHeight) / 2;
                        } else {
                            drawHeight = targetHeight;
                            drawWidth = targetHeight * imgRatio;
                            offsetX = (targetWidth - drawWidth) / 2;
                            offsetY = 0;
                        }
                        ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error("Échec blob PNG"));
                            const blobReader = new FileReader();
                            blobReader.onload = () => resolve(blobReader.result);
                            blobReader.onerror = () => reject(new Error("Erreur lecture blob"));
                            blobReader.readAsDataURL(blob);
                        }, 'image/png');
                    };
                    img.onerror = () => reject(new Error("Échec chargement image"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Échec lecture fichier"));
                reader.readAsDataURL(file);
            });
        }

        // ---------- LAZY LOADING ----------
        function initPosterObserver() {
            if (posterObserver) posterObserver.disconnect();
            posterObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.dataset.src;
                        if (src) {
                            const loadImg = new Image();
                            loadImg.onload = () => {
                                img.src = src;
                                img.classList.add('loaded');
                                img.classList.remove('lazy');
                                const repoKey = img.dataset.repokey;
                                if (repoKey) {
                                    posterMemoryCache.set(repoKey, src);
                                    const cache = getPosterCache();
                                    cache[repoKey] = src;
                                    setPosterCache(cache);
                                }
                                img.dataset.src = '';
                            };
                            loadImg.onerror = () => {
                                img.parentElement.innerHTML = `<div class='poster-placeholder w-full h-full flex items-center justify-center text-zinc-500 text-xs'>No poster</div>`;
                            };
                            loadImg.src = src;
                        }
                        posterObserver.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });
        }

            try {

                    headers: { 'Authorization': `token ${token}` }

                if(!response.ok) throw new Error("Impossible de récupérer les dépôts");
                const repos = await response.json();
                allRepositories = repos;
                setCachedRepos(repos);
                document.getElementById('repoSearch').value = "";
                renderRepos(repos);
                showNotification(`✅ ${repos.length} dépôts chargés`, "success");
            } catch(err) {
                showNotification(err.message, "danger");
            } finally {
                setActivityState(false);
            }
        }

        function filterRepositories() {
            const q = document.getElementById('repoSearch').value.toLowerCase();
            const filtered = allRepositories.filter(r => r.name.toLowerCase().includes(q));
            renderRepos(filtered);
        }

        function getTracker(repoName) {
            let el = document.getElementById(`tracker-${repoName}`);
            if (!el) {
                const repoDiv = document.getElementById(`repo-${repoName}`);
                if (repoDiv) {
                    const newTracker = document.createElement('div');
                    newTracker.id = `tracker-${repoName}`;
                    newTracker.className = 'tracker-terminal bg-deep-800 border border-cyber-amber/30 rounded-lg mt-2 p-2 text-[9px] font-mono text-zinc-400 shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] hidden flex-col gap-1 max-h-[140px] overflow-y-auto';
                    newTracker.innerHTML = `<div class="flex justify-between border-b border-zinc-800 pb-1.5 mb-1 font-bold text-[8px] text-cyber-amber uppercase tracking-wider"><span>⛁ Logs</span><span>⚡ live</span></div>`;
                    repoDiv.appendChild(newTracker);
                    el = newTracker;
                }
            }
            return el;
        }

        function showTracker(repoName) { const t = getTracker(repoName); if(t) t.style.display = 'flex'; }
        function clearTracker(repoName) { const t = getTracker(repoName); if(t) t.innerHTML = `<div class="flex justify-between border-b border-zinc-800 pb-1.5 mb-1 font-bold text-[8px] text-cyber-amber uppercase tracking-wider"><span>⛁ Logs</span><span>⚡ live</span></div>`; }
        function addLog(repoName, message, status = "step") {
            const t = getTracker(repoName);
            if (!t) return;
            const line = document.createElement('div');
            line.className = `log-line log-${status === 'error' ? 'error' : (status === 'success' ? 'success' : (status === 'warning' ? 'warning' : 'step'))}`;
            const time = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            let sym = status === 'success' ? '✓' : (status === 'error' ? '✗' : (status === 'loading' ? '⟳' : '▶'));
            line.innerHTML = `<span class="text-zinc-600">[${time}]</span> ${sym} ${message}`;
            if (status === 'loading') line.innerHTML += `<span class="inline-block w-2 h-2 border border-cyber-amber/30 border-t-cyber-amber rounded-full animate-spin-slow ml-1.5 align-middle"></span>`;
            t.appendChild(line);
            t.scrollTop = t.scrollHeight;
        }

        async function handleFileAction(owner, repo, filename, branch, buttonElement) {
            if (upModeState[repo]) {
                await pasteToGitFile(owner, repo, filename, branch, buttonElement);
            } else {
                await copyGitFile(owner, repo, filename, branch);
            }
        }

        function toggleUpMode(buttonEl, repoName) {
            const isActive = upModeState[repoName] || false;
            if (isActive) {
                upModeState[repoName] = false;
                buttonEl.classList.remove('btn-up-active');
            } else {
                upModeState[repoName] = true;
                buttonEl.classList.add('btn-up-active');
                showTracker(repoName);
            }
        }

        async function pasteToGitFile(owner, repo, filename, branch, buttonElement) {
            const token = localStorage.getItem('hubcode_token');
            if (!token) { showNotification("Token manquant", "danger"); return; }
            buttonElement.classList.add('animate-flash-red');
            setActivityState(true, "UP");
            showTracker(repo);
            try {
                let clipboardText = await navigator.clipboard.readText();
                if (!clipboardText || clipboardText.trim() === "") throw new Error("Presse-papiers vide");
                let currentSha = null;
                const getResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}?ref=${branch}`, { headers: { 'Authorization': `token ${token}` } });
                if (getResp.status === 200) currentSha = (await getResp.json()).sha;
                else if (getResp.status !== 404) throw new Error(`GET ${getResp.status}`);
                const b64Content = utf8ToB64(clipboardText);
                const putBody = { message: `Hubcode: UP ${filename}`, content: b64Content, branch: branch };
                if (currentSha) putBody.sha = currentSha;
                const putResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                    method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(putBody)
                });
                if (!putResp.ok) throw new Error((await putResp.json()).message || `PUT ${putResp.status}`);
                addLog(repo, `✅ ${filename} OK`, "success");
                showNotification(`${filename} mis à jour`, "success");
            } catch (err) {
                addLog(repo, `ERREUR: ${err.message}`, "error");
                showNotification(`Échec: ${err.message}`, "danger");
            } finally {
                buttonElement.classList.remove('animate-flash-red');
                upModeState[repo] = false;
                setActivityState(false);
            }
        }

        async function copyGitFile(owner, repo, filename) {
            const token = localStorage.getItem('hubcode_token');
            setActivityState(true, "COPY");
            try {
                const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, { headers: { 'Authorization': `token ${token}` } });
                if (!r.ok) throw new Error("Fichier introuvable");
                const content = b64ToUtf8((await r.json()).content);
                await navigator.clipboard.writeText(content);
                showNotification(`${filename.toUpperCase()} copié`, 'success');
            } catch(e) { showNotification(e.message, 'danger'); }
            finally { setActivityState(false); }
        }

        function viewLivePage(owner, repo) { window.open(`https://${owner.toLowerCase()}.github.io/${repo}/?t=${Date.now()}`, '_blank'); }

        function createEmptyRepo(cleanName) {}

        async function deleteRepository(owner, repoName) {
            const token = localStorage.getItem('hubcode_token');
            setActivityState(true, "DEL");
            try {
                const r = await fetch(`https://api.github.com/repos/${owner}/${repoName}`, { method: 'DELETE', headers: { 'Authorization': `token ${token}` } });
                if (r.status === 204 || r.status === 240) {
                    allRepositories = allRepositories.filter(rp => rp.name !== repoName);
                    document.getElementById(`repo-${repoName}`)?.remove();
                    showNotification(`Supprimé`, 'success');
                } else throw new Error("Droits insuffisants");
            } catch(e) { showNotification(e.message, 'danger'); }
            finally { setActivityState(false); }
        }

        function showConfirmPanel(repoName) { const p = document.getElementById(`confirm-${repoName}`); if(p) p.style.display = 'flex'; }
        function hideConfirmPanel(repoName) { const p = document.getElementById(`confirm-${repoName}`); if(p) p.style.display = 'none'; }

        // ---------- RENDER REPOS ----------
        function renderRepos(repos) {
            const container = document.getElementById('repoListContainer');
            container.innerHTML = "";
            if (repos.length === 0) { container.innerHTML = `<div class="text-center text-zinc-600 py-6 text-[11px] font-medium">Aucun dépôt trouvé.</div>`; return; }
            const posterCache = getPosterCache();

            repos.forEach(repo => {
                const div = document.createElement('div');
                div.className = 'bg-deep-500/90 border border-zinc-800/60 rounded-xl p-2.5 shadow-neu-dark transition-all duration-200 flex-shrink-0 repo-item';
                div.id = `repo-${repo.name}`;
                const repoKey = `${repo.owner.login}/${repo.name}`;
                let posterDataUrl = posterMemoryCache.get(repoKey) || posterCache[repoKey] || null;

                const leftButtons = [
                    { label: '💉 Inject', color: 'text-cyber-amber', bg: 'bg-cyber-amber/10 hover:bg-cyber-amber/20', onclick: `confirmedInject('${repo.owner.login}', '${repo.name}', '${repo.default_branch}')` },
                    { label: 'UP', color: 'text-zinc-400 hover:text-white', onclick: `toggleUpMode(this, '${repo.name}')` },
                    { label: 'HTML', color: 'text-cyber-violet hover:text-white', bg: 'hover:bg-cyber-violet/10', onclick: `handleFileAction('${repo.owner.login}', '${repo.name}', 'index.html', '${repo.default_branch}', this)` },
                    { label: 'JSON', color: 'text-cyber-amber hover:text-white', bg: 'hover:bg-cyber-amber/10', onclick: `handleFileAction('${repo.owner.login}', '${repo.name}', 'manifest.json', '${repo.default_branch}', this)` },
                    { label: 'SW', color: 'text-emerald-400 hover:text-white', bg: 'hover:bg-emerald-500/10', onclick: `handleFileAction('${repo.owner.login}', '${repo.name}', 'sw.js', '${repo.default_branch}', this)` },
                    { label: 'Image', color: 'text-purple-400 hover:text-white', bg: 'hover:bg-purple-500/10', onclick: `openImageModal('${repo.name}', '${repo.owner.login}', '${repo.default_branch}')` }
                ];

                const rightButtons = [
                    { label: 'View', color: 'text-white hover:bg-zinc-600', onclick: `viewLivePage('${repo.owner.login}', '${repo.name}')` },
                    { label: 'Runs', color: 'text-cyber-violet hover:text-white', bg: 'hover:bg-cyber-violet/20', onclick: `fetchRepoActions('${repo.owner.login}', '${repo.name}')` },
                    { label: 'Custom', color: 'text-fuchsia-400 hover:text-white', bg: 'hover:bg-fuchsia-500/10', onclick: `openCustomModal('${repo.name}', '${repo.owner.login}', '${repo.default_branch}')` },
                    { label: 'Poster', color: 'text-cyan-400 hover:text-white', bg: 'hover:bg-cyan-500/10', onclick: `uploadPoster('${repo.owner.login}', '${repo.name}', '${repo.default_branch}')` },
                    { label: 'Sup', color: 'text-red-400 hover:text-white', bg: 'hover:bg-red-500/10', onclick: `showConfirmPanel('${repo.name}')` }
                ];

                let leftBtnsHtml = leftButtons.map(btn => `
                    <button class="btn-press py-2 bg-deep-600 border border-zinc-700/40 rounded-lg 
                                   ${btn.color} font-bold text-[9px] uppercase tracking-wider
                                   ${btn.bg || ''} transition-all duration-200"
                            onclick="playHum60Hz(); ${btn.onclick}">${btn.label}</button>
                `).join('');

                let rightBtnsHtml = rightButtons.map(btn => `
                    <button class="btn-press py-2 bg-deep-600 border border-zinc-700/40 rounded-lg 
                                   ${btn.color} font-bold text-[9px] uppercase tracking-wider
                                   ${btn.bg || ''} transition-all duration-200"
                            onclick="playHum60Hz(); ${btn.onclick}">${btn.label}</button>
                `).join('');

                let posterHtml = posterDataUrl
                    ? `<img src="${posterDataUrl}" alt="Poster" class="w-full h-full object-cover poster-img loaded" data-repokey="${repoKey}" onclick="openPosterFullscreen(this)">`
                    : `<img data-src="https://raw.githubusercontent.com/${repo.owner.login}/${repo.name}/${repo.default_branch}/Poster.png?t=${Date.now()}" data-repokey="${repoKey}" alt="Poster" class="w-full h-full object-cover poster-img lazy" onclick="openPosterFullscreen(this)">`;

                div.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-mono font-bold text-zinc-200 text-[11px] tracking-wide truncate">${repo.name}</span>
                        <span class="text-[8px] text-zinc-600 font-mono flex-shrink-0">${repo.default_branch}</span>
                    </div>
                    <div class="flex items-center justify-center gap-2">
                        <div class="flex flex-col gap-1.5 flex-1 min-w-0">${leftBtnsHtml}</div>
                        <div class="poster-container">${posterHtml}</div>
                        <div class="flex flex-col gap-1.5 flex-1 min-w-0">${rightBtnsHtml}</div>
                    </div>
                    <div class="hidden flex-col gap-2 bg-deep-700/90 border border-red-500/40 rounded-lg p-2.5 mt-2 text-center text-[10px]" id="confirm-${repo.name}">
                        <span class="text-red-400 font-bold text-[10px]">Supprimer ?</span>
                        <div class="flex gap-2">
                            <button class="btn-press flex-1 py-2 bg-red-500 rounded-lg text-white font-bold text-[9px] uppercase tracking-wider" onclick="playHum60Hz(); deleteRepository('${repo.owner.login}', '${repo.name}')">Oui</button>
                            <button class="btn-press flex-1 py-2 bg-zinc-700 rounded-lg text-white font-bold text-[9px] uppercase tracking-wider" onclick="playHum60Hz(); hideConfirmPanel('${repo.name}')">Non</button>
                        </div>
                    </div>
                    <div class="tracker-terminal bg-deep-800 border border-cyber-amber/30 rounded-lg mt-2 p-2 text-[9px] font-mono text-zinc-400 shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] hidden flex-col gap-1 max-h-[140px] overflow-y-auto" id="tracker-${repo.name}">
                        <div class="flex justify-between border-b border-zinc-800 pb-1.5 mb-1 font-bold text-[8px] text-cyber-amber uppercase tracking-wider"><span>⛁ Logs</span><span>⚡ live</span></div>
                    </div>
                `;
                container.appendChild(div);

                const img = div.querySelector('.poster-img.lazy');
                if (img && posterObserver) posterObserver.observe(img);
                if (upModeState[repo.name]) {
                    const upBtn = div.querySelector('.btn-up');
                    if (upBtn) upBtn.classList.add('btn-up-active');
                }
            });
        }

        async function confirmedInject(owner, repo, branch) {
            const token = localStorage.getItem('hubcode_token');
            if (!token) { showNotification("Token manquant", "danger"); return; }
            setActivityState(true, "INJECT");
            showTracker(repo);
            clearTracker(repo);
            addLog(repo, `Injection PWA...`, 'step');
            try {
                const getResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html?ref=${branch}`, { headers: { 'Authorization': `token ${token}` } });
                let currentSha = null, originalHtml = "";
                if (getResp.status === 200) {
                    const data = await getResp.json();
                    currentSha = data.sha;
                    originalHtml = b64ToUtf8(data.content);
                } else if (getResp.status === 404) {
                    originalHtml = `<!DOCTYPE html><html><head><title>${repo}</title></head><body><h1>${repo}</h1></body></html>`;
                } else throw new Error(`HTTP ${getResp.status}`);

                const headElements = `\n<link rel="manifest" href="./manifest.json">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<meta name="theme-color" content="#4b6cb7">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<link rel="apple-touch-icon" href="icon.png">`;
                const swScript = `\n<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</` + 'script>\n';

                const parser = new DOMParser();
                const doc = parser.parseFromString(originalHtml, 'text/html');
                if (doc.head) doc.head.insertAdjacentHTML('beforeend', headElements);
                else doc.documentElement.insertAdjacentHTML('afterbegin', '<head>' + headElements + '</head>');
                if (doc.body) doc.body.insertAdjacentHTML('beforeend', swScript);
                else doc.documentElement.insertAdjacentHTML('beforeend', '<body>' + swScript + '</body>');

                let updatedHtml = doc.documentElement.outerHTML;
                if (!originalHtml.toLowerCase().includes('<!doctype html>')) updatedHtml = '<!DOCTYPE html>\n' + updatedHtml;

                const b64Content = utf8ToB64(updatedHtml);
                const putBody = { message: "Hubcode: injection PWA", content: b64Content, branch: branch };
                if (currentSha) putBody.sha = currentSha;
                await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
                    method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(putBody)
                });

                // Régénérer le SW
                await regenerateServiceWorker(owner, repo, branch);

                addLog(repo, "✅ Injection PWA terminée", 'success');
                showNotification(`PWA injectée`, 'success');
            } catch (err) {
                addLog(repo, `ERREUR: ${err.message}`, 'error');
                showNotification(`Échec: ${err.message}`, 'danger');
            } finally { setActivityState(false); }
        }

        window.openPosterFullscreen = openPosterFullscreen;

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                ['imageModal', 'customModal', 'createModal'].forEach(id => {
                    const m = document.getElementById(id);
                    if (m && m.style.display === 'block') {
                        if (id === 'imageModal') closeImageModal();
                        if (id === 'customModal') closeCustomModal();
                        if (id === 'createModal') closeCreateModal();
                    }
                });
                const overlay = document.querySelector('.poster-fullscreen-overlay');
                if (overlay) overlay.remove();
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                if (document.getElementById('imageModal').style.display === 'block' && document.activeElement !== document.getElementById('imageFileInput')) confirmImageUpload();
                if (document.getElementById('customModal').style.display === 'block' && document.activeElement !== document.getElementById('customFileContent')) confirmCustomFile();
                if (document.getElementById('createModal').style.display === 'block') confirmCreateRepo();
            }
        });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
    </script>
